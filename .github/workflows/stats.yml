name: Fréquentation

# Archive chaque jour les visites GoatCounter dans stats/frequentation.json.
on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours, 03h17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les visites
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch_stats.py --racine .

      - name: Commiter si modifié
        run: |
          if [ -n "$(git status --porcelain stats/frequentation.json)" ]; then
            git config user.name  "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add stats/frequentation.json
            git commit -m "chore(stats): mise à jour fréquentation [stats-auto]"
            git pull --rebase
            git push
          else
            echo "Aucun changement"
          fi
